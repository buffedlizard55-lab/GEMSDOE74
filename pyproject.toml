[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsdoe74"
version = "0.1.0"
description = "GEMSDOE74 — Steerable 8-Azimuth Radon & PU Piedmont Discovery for DOE GEMS Prize"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "lightgbm>=4.0",
    "rasterio>=1.3",
    "matplotlib>=3.7",
    "pandas>=2.0",
]
[tool.pytest.ini_options]
pythonpath = ["src", "vendor", "scripts"]
testpaths = ["tests"]
