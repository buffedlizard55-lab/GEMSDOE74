name: Integrity tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy rasterio scikit-learn pytest
      - run: pytest -q
      - run: python scripts/build_site.py && git diff --exit-code -- docs/
