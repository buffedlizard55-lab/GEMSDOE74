name: Integrity tests
on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (CPU wheel for PyTorch)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            numpy scipy scikit-learn lightgbm torch rasterio pytest
      - name: Run 3-pass automated verification suite
        run: pytest -vv
